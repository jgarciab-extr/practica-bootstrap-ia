<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Simple Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="hero-section">
        <section class="bg-dark text-white py-5">
            <div class="container">
                <div class="row align-items-center">
                
                    <!-- Columna izquierda: texto -->
                    <div class="col-md-6">
                        <h1 class="display-4 fw-bold">
                            Impulsa tu negocio con <span class="text-info">soluciones</span> a tu medida
                        </h1>
                        <p class="lead">
                            Creamos experiencias digitales claras, rápidas y adaptadas a lo que tu proyecto necesita.
                        </p>
                        <a href="#services-section" class="btn btn-outline-info btn-lg">Ver servicios</a>
                    </div>
                
                    <!-- Columna derecha: apoyo visual -->
                    <div class="col-md-6">
                        <div class="border border-info rounded p-5 text-center">
                            <h2 class="h3">Diseño <span class="text-info">sencillo</span></h2>
                            <p class="mb-0">
                                Una base sólida construida al 100% con Bootstrap.
                            </p>
                        </div>
                    </div>
                
                </div>
            </div>
    </section>
    </div>
    <div id="services-section"></div>
</body>
</html>
